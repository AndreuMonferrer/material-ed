<style>
/* Layout: una sola columna tipo app, tarjeta central grande con el carácter como protagonista */
:root{
  --bg:#EDF1EE; --surface:#FBFCFA; --ink:#17201C; --muted:#5D6B64; --line:#D3DCD6;

  --han:"Noto Serif SC","Songti SC","STSong",serif;
  --ui:"Manrope",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#1A221F; --ink:#E6ECE8; --muted:#93A39B; --line:#2C3833;
  --jade:#5FBF98; --jade-soft:#1F3A2F; --seal:#E8786B; --seal-soft:#3E2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#1A221F; --ink:#E6ECE8; --muted:#93A39B; --line:#2C3833;
  --jade:#5FBF98; --jade-soft:#1F3A2F; --seal:#E8786B; --seal-soft:#3E2220; color-scheme:dark}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px}
.app{max-width:520px;margin:0 auto;padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;min-height:100%;box-sizing:border-box}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:var(--han);font-weight:700;font-size:26px;letter-spacing:.04em}
h1 small{font-family:var(--ui);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em;margin-left:6px;text-transform:uppercase}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog b{color:var(--jade)}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);width:0;transition:width .3s}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:600 14px var(--ui);padding:9px 6px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--jade);color:var(--surface)}
.seg.small button{font-size:12.5px;padding:7px 4px}
button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;min-height:300px;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.lvl{position:absolute;top:12px;left:14px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.speak{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--jade);display:grid;place-items:center;cursor:pointer}
.han{font-family:var(--han);font-size:clamp(64px,22vw,112px);line-height:1.1;font-weight:500;text-align:center;word-break:keep-all}
.han.long{font-size:clamp(48px,15vw,84px)}
.py{font-size:22px;font-weight:600;color:var(--jade);letter-spacing:.02em}
.mean{font-size:18px;text-align:center;max-width:30ch}
.hint{font-size:13px;color:var(--muted)}
.prompt{font-size:22px;font-weight:600;text-align:center;max-width:24ch;text-wrap:balance}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--ui);padding:14px 10px;border-radius:14px;cursor:pointer;min-height:52px}
.btn.no{color:var(--seal);border-color:var(--seal-soft)}
.btn.yes{background:var(--jade);border-color:var(--jade);color:var(--surface)}
.opt{font-size:16px;text-align:center;line-height:1.3}
.opt.hz{font-family:var(--han);font-size:28px;font-weight:500}
.opt.ok{background:var(--jade-soft);border-color:var(--jade);color:var(--ink)}
.opt.bad{background:var(--seal-soft);border-color:var(--seal);color:var(--ink)}
.opt:disabled{cursor:default}
.stats{display:flex;justify-content:center;gap:18px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.foot{margin-top:auto;font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:4px}
.dots{display:flex;gap:4px}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--jade)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">

    <h1>汉字<small>HSK 1 · 2</small></h1>
    <div class="prog"><b id="known">0</b> / <span id="total">0</span> dominadas</div>
  </header>
  <div class="bar"><i id="barfill"></i></div>

  <div class="seg" id="levelSeg" role="group" aria-label="Nivel">
    <button id="lv1" data-lv="1" aria-pressed="false">HSK 1</button>
    <button id="lv2" data-lv="2" aria-pressed="false">HSK 2</button>
    <button id="lv0" data-lv="0" aria-pressed="true">Los dos</button>
  </div>
  <div class="seg" id="modeSeg" role="group" aria-label="Modo">
    <button id="mCards" data-mode="cards" aria-pressed="true">Tarjetas</button>
    <button id="mQuiz" data-mode="quiz" aria-pressed="false">Test</button>
  </div>
  <div class="seg small" id="dirSeg" role="group" aria-label="Tipo de pregunta" hidden>
    <button id="d1" data-dir="hm" aria-pressed="true">汉字 → significado</button>
    <button id="d2" data-dir="mh" aria-pressed="false">significado → 汉字</button>
    <button id="d3" data-dir="hp" aria-pressed="false">汉字 → pinyin</button>
  </div>

  <main id="stage"></main>

  <div class="stats" id="stats"></div>
  <p class="foot">Las palabras que fallas salen más a menudo. Tu progreso se guarda en este dispositivo.<br><button class="link" id="reset">Borrar progreso</button><span id="confirmWrap" hidden> ¿Seguro? <button class="link" id="resetYes">Sí, borrar</button></span></p>
</div>

const parse=(raw,lv)=>raw.trim().split("\n").map(l=>{const [h,p,m]=l.split("|");return {h,p,m,lv}});
const ALL=[...parse(RAW1,1),...parse(RAW2,2)];

// Fuente china con solo los caracteres usados (descarga pequeña)
(()=>{const chars=[...new Set(ALL.map(w=>w.h).join("")+"汉字练习")].join("");
const l=document.createElement("link");l.rel="stylesheet";
l.href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap";document.head.appendChild(l);
const l2=document.createElement("link");l2.rel="stylesheet";
l2.href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap&text="+encodeURIComponent(chars);document.head.appendChild(l2);})();

const KEY="hanzi-hsk12-v1";
let S={box:{},level:0,mode:"cards",dir:"hm"};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let sess={ok:0,bad:0,streak:0};
let cur=null,revealed=false,lastH=null;

const pool=()=>ALL.filter(w=>!S.level||w.lv===S.level);
const boxOf=w=>S.box[w.h]||0;
function pick(){
  const p=pool();let tot=0;const ws=p.map(w=>{const b=boxOf(w);const wt=w.h===lastH?0:[8,4,2,1,.4][b];tot+=wt;return wt});
  let r=Math.random()*tot;for(let i=0;i<p.length;i++){r-=ws[i];if(r<=0)return p[i]}return p[0];
}
function grade(w,good){const b=boxOf(w);S.box[w.h]=good?Math.min(4,b+1):0;save();
  if(good){sess.ok++;sess.streak++}else{sess.bad++;sess.streak=0}}

function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const icon='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';
const dots=w=>'<div class="dots" aria-label="Nivel de dominio">'+[1,2,3,4].map(i=>`<span class="${boxOf(w)>=i?"on":""}"></span>`).join("")+'</div>';
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const stage=document.getElementById("stage");

function renderCard(){
  cur=pick();lastH=cur.h;revealed=false;draw();
}
function draw(){
  const w=cur;
  if(S.mode==="cards"){
    stage.innerHTML=`<div class="card" id="cardBox" role="button" tabindex="0" aria-label="Mostrar respuesta">
      <span class="lvl">HSK ${w.lv}</span>
      <button class="speak" id="spk" aria-label="Escuchar pronunciación">${icon}</button>
      <div class="han ${w.h.length>2?"long":""}">${w.h}</div>
      ${revealed?`<div class="py">${esc(w.p)}</div><div class="mean">${esc(w.m)}</div>${dots(w)}`:`<div class="hint">Toca para ver pinyin y significado</div>`}
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn no" id="again" ${revealed?"":"disabled"}>Otra vez</button>
      <button class="btn yes" id="know" ${revealed?"":"disabled"}>La sé</button>
    </div>`;
    const cb=document.getElementById("cardBox");
    const rev=()=>{if(!revealed){revealed=true;draw();speak(w.h)}};
    cb.onclick=e=>{if(e.target.closest("#spk"))return;rev()};
    cb.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();rev()}};
    document.getElementById("spk").onclick=e=>{e.stopPropagation();speak(w.h)};
    document.getElementById("again").onclick=()=>{grade(w,false);next()};
    document.getElementById("know").onclick=()=>{grade(w,true);next()};
  } else {
    const p=pool();const field=S.dir==="hp"?"p":S.dir==="mh"?"h":"m";
    const opts=[w];const seen=new Set([w[field]]);
    let guard=0;while(opts.length<4&&guard++<200){const o=p[Math.floor(Math.random()*p.length)];if(!seen.has(o[field])){seen.add(o[field]);opts.push(o)}}
    opts.sort(()=>Math.random()-.5);
    const q=S.dir==="mh"?`<div class="prompt">${esc(w.m)}</div><div class="hint">Elige el carácter</div>`
      :`<div class="han ${w.h.length>2?"long":""}">${w.h}</div><div class="hint">${S.dir==="hp"?"¿Cómo se pronuncia?":"¿Qué significa?"}</div>`;
    stage.innerHTML=`<div class="card" style="cursor:default;min-height:240px">
      <span class="lvl">HSK ${w.lv}</span>
      <button class="speak" id="spk" aria-label="Escuchar pronunciación">${icon}</button>${q}
      <div id="after"></div></div>
      <div class="row" style="margin-top:12px" id="opts">${opts.map((o,i)=>`<button class="btn opt ${field==="h"?"hz":""}" id="o${i}" data-i="${i}">${esc(o[field])}</button>`).join("")}</div>
      <div class="row" style="margin-top:10px;grid-template-columns:1fr" id="nextRow" hidden><button class="btn yes" id="nextBtn">Siguiente</button></div>`;
    document.getElementById("spk").onclick=()=>speak(w.h);
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const o=opts[+b.dataset.i];const good=o===w;grade(w,good);
      document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(opts[+x.dataset.i]===w)x.classList.add("ok")});
      if(!good)b.classList.add("bad");
      document.getElementById("after").innerHTML=`<div class="py">${esc(w.p)}</div><div class="mean">${S.dir==="mh"?"":esc(w.m)}</div>`;
      speak(w.h);stats();
      document.getElementById("nextRow").hidden=false;document.getElementById("nextBtn").focus();
      document.getElementById("nextBtn").onclick=next;
    });
  }
  stats();
}
function next(){renderCard()}
function stats(){
  const p=pool();const k=p.filter(w=>boxOf(w)>=3).length;
  document.getElementById("known").textContent=k;document.getElementById("total").textContent=p.length;
  document.getElementById("barfill").style.width=(p.length?k/p.length*100:0)+"%";
  document.getElementById("stats").innerHTML=`<span>Aciertos <b>${sess.ok}</b></span><span>Fallos <b>${sess.bad}</b></span><span>Racha <b>${sess.streak}</b></span>`;
}
function syncSeg(){
  document.querySelectorAll("#levelSeg button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.lv===S.level));
  document.querySelectorAll("#modeSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===S.mode));
  document.querySelectorAll("#dirSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.dir===S.dir));
  document.getElementById("dirSeg").hidden=S.mode!=="quiz";
}
document.querySelectorAll("#levelSeg button").forEach(b=>b.onclick=()=>{S.level=+b.dataset.lv;save();syncSeg();renderCard()});
document.querySelectorAll("#modeSeg button").forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;save();syncSeg();revealed=false;draw()});
document.querySelectorAll("#dirSeg button").forEach(b=>b.onclick=()=>{S.dir=b.dataset.dir;save();syncSeg();draw()});
document.getElementById("reset").onclick=()=>{document.getElementById("confirmWrap").hidden=false};
document.getElementById("resetYes").onclick=()=>{S.box={};sess={ok:0,bad:0,streak:0};save();document.getElementById("confirmWrap").hidden=true;renderCard()};
syncSeg();renderCard();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>

</body>
</html>
