<title>Hanzi HSK 1·2</title>
<meta name="theme-color" content="#2B7A5F">

<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: una sola columna tipo app; el carácter es el protagonista */
:root{
  --bg:#EDF1EE; --surface:#FBFCFA; --ink:#17201C; --muted:#5D6B64; --line:#D3DCD6;
  --jade:#2B7A5F; --jade-soft:#D6E9E0; --seal:#B5372B; --seal-soft:#F3DCD8;
  --han:"Noto Serif SC","Songti SC","STSong",serif;
  --ui:"Manrope",system-ui,-apple-system,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111715; --surface:#1A221F; --ink:#E6ECE8; --muted:#93A39B; --line:#2C3833;
  --jade:#5FBF98; --jade-soft:#1F3A2F; --seal:#E8786B; --seal-soft:#3E2220; color-scheme:dark}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
.app{max-width:520px;margin:0 auto;padding-block:14px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-family:var(--han);font-weight:700;font-size:26px;letter-spacing:.04em}
h1 small{font-family:var(--ui);font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em;margin-left:6px;text-transform:uppercase}
h2{margin:4px 0 0;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prog{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog b{color:var(--jade)}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);width:0;transition:width .3s}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:600 14px var(--ui);padding:9px 6px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--jade);color:var(--surface)}
.seg.small button{font-size:12.5px;padding:7px 4px}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--seal);color:var(--surface);font-size:11px;line-height:18px;font-variant-numeric:tabular-nums}
button:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;min-height:280px;justify-content:center;-webkit-tap-highlight-color:transparent}
.card.tap{cursor:pointer}
.lvl{position:absolute;top:12px;left:14px;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);font-variant-numeric:tabular-nums}
.speak{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--jade);display:grid;place-items:center;cursor:pointer}
.han{font-family:var(--han);font-size:clamp(64px,22vw,112px);line-height:1.1;font-weight:500;text-align:center}
.han.long{font-size:clamp(46px,14vw,80px)}
.py{font-size:22px;font-weight:600;color:var(--jade)}
.mean{font-size:18px;text-align:center;max-width:30ch}
.hint{font-size:13px;color:var(--muted);text-align:center}
.prompt{font-size:22px;font-weight:600;text-align:center;max-width:24ch;text-wrap:balance}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 15px var(--ui);padding:14px 10px;border-radius:14px;cursor:pointer;min-height:52px}
.btn:disabled{opacity:.5;cursor:default}
.btn.no{color:var(--seal);border-color:var(--seal-soft)}
.btn.yes{background:var(--jade);border-color:var(--jade);color:var(--surface)}
.btn.wide{width:100%}
.btn.ghost{background:transparent}
.opt{font-size:16px;line-height:1.3}
.opt.hz{font-family:var(--han);font-size:28px;font-weight:500}
.opt.ok{background:var(--jade-soft);border-color:var(--jade);color:var(--ink);opacity:1}
.opt.bad{background:var(--seal-soft);border-color:var(--seal);color:var(--ink);opacity:1}
.stats{display:flex;justify-content:center;gap:18px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink)}
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.blk{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;font:inherit}
.blk b{font-size:15px}
.blk span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.blk .hz{font-family:var(--han);font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.done{border-color:var(--jade)}
.blk.done span.sc{color:var(--jade);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.big{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:18px;color:var(--muted);font-weight:600}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 2px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .h{font-family:var(--han);font-size:26px;min-width:2.2em}
.item .t{min-width:0}
.item .t div:first-child{color:var(--jade);font-weight:600}
.item .t div:last-child{font-size:14px;overflow-wrap:anywhere}
.x{border:0;background:transparent;color:var(--muted);font:600 12px var(--ui);padding:8px;cursor:pointer;display:flex;align-items:center;gap:4px}
.cnt{font-size:11px;color:var(--seal);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:24px 8px;line-height:1.5}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer;padding:4px}
.foot{font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:3px}
.mode b{font-size:15px}
.mode span{font-size:12px;color:var(--muted);line-height:1.35}
.mode[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft)}
.bigspk{width:96px;height:96px;border-radius:50%;border:0;background:var(--jade);color:var(--surface);display:grid;place-items:center;cursor:pointer}
.opt.pyopt{font-size:20px;font-weight:600;letter-spacing:.02em}
#modeSeg button{font-size:13px;padding:9px 2px}
.stories{display:flex;flex-direction:column;gap:10px}
.story{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;display:grid;gap:3px;font:inherit;color:var(--ink);cursor:pointer;position:relative}
.story .zh{font-family:var(--han);font-size:22px;font-weight:700}
.story .meta{font-size:12px;color:var(--muted)}
.story .meta em{color:var(--jade);font-style:normal;font-weight:700}
.tag{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.story .tag{position:absolute;top:14px;right:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:8px 14px;font:600 13px var(--ui);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--surface)}
.text{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 14px;display:flex;flex-direction:column;gap:16px}
.sent{display:grid;grid-template-columns:1fr auto;gap:2px 6px;align-items:start}
.zhline{font-family:var(--han);font-size:24px;line-height:2.2;min-width:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.nopy .zhline{line-height:1.7}
ruby.w{cursor:pointer;border-radius:5px;padding:0 1px;-webkit-tap-highlight-color:transparent}
ruby.w.sel{background:var(--jade-soft)}
ruby.w.saved{text-decoration:underline dotted var(--seal);text-underline-offset:5px}
rt{font-family:var(--ui);font-size:12px;color:var(--jade);font-weight:600;letter-spacing:0}
.nopy rt{display:none}
.tr{grid-column:1/-1;font-size:14px;color:var(--muted);line-height:1.45}
.notr .tr{display:none}
#sheetBg{position:fixed;inset:0;background:rgba(10,15,12,.4);z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;padding-top:22px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.dots{display:flex;gap:4px}
.dots span{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots span.on{background:var(--jade)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="app">
  <header>
    <h1>汉字<small>HSK 1 · 2</small></h1>
    <div class="prog"><b id="known">0</b> / <span id="total">0</span> dominadas</div>
  </header>
  <div class="bar"><i id="barfill"></i></div>

  <div class="seg" id="modeSeg" role="group" aria-label="Sección">
    <button id="mCards" data-mode="cards">Tarjetas</button>
    <button id="mQuiz" data-mode="quiz">Test</button>
    <button id="mRead" data-mode="read">Lecturas</button>
    <button id="mFails" data-mode="fails">Fallos<span class="badge" id="failBadge" hidden>0</span></button>
  </div>
  <div class="seg" id="levelSeg" role="group" aria-label="Nivel">
    <button id="lv1" data-lv="1">HSK 1</button>
    <button id="lv2" data-lv="2">HSK 2</button>
    <button id="lv0" data-lv="0">Los dos</button>
  </div>

  <main id="stage"></main>
  <div class="stats" id="stats"></div>
  <p class="foot" id="foot">Tu progreso se guarda en este móvil.<br><button class="link" id="reset">Borrar todo el progreso</button><span id="confirmWrap" hidden> ¿Seguro? <button class="link" id="resetYes">Sí, borrar</button></span></p>
</div>
<div id="sheetBg" hidden></div>
<div id="sheet" hidden role="dialog" aria-label="Palabra">
  <button class="x" id="sheetClose" style="position:absolute;top:8px;right:8px;font-size:20px" aria-label="Cerrar">✕</button>
  <span class="tag" id="shTag"></span>
  <div class="han" id="shHan" style="font-size:64px"></div>
  <div class="py" id="shPy"></div>
  <div class="mean" id="shMean"></div>
  <div class="row" style="width:100%;margin-top:6px">
    <button class="btn" id="shSay">Escuchar</button>
    <button class="btn yes" id="shSave">Guardar para estudiar</button>
  </div>
</div>

const REV={};for(const[b,m]of Object.entries(TONES))[...m].forEach((c,i)=>REV[c]=[b,i+1]);
function toneVariants(p){
  const ch=[...p];let pos=[],orig=[];
  ch.forEach((c,i)=>{if(REV[c]){pos.push(i);orig.push(REV[c][1])}});
  const base=ch.slice();pos.forEach(i=>base[i]=REV[ch[i]][0]);
  if(!pos.length){const low=p.toLowerCase();let i=low.search(/[ae]/);if(i<0)i=low.indexOf("ou");
    if(i<0)for(let k=ch.length-1;k>=0;k--)if("iouü".includes(low[k])){i=k;break}
    if(i<0)return[];pos=[i];orig=[0]}
  const n=pos.length,combos=[];
  for(let c=0;c<4**n;c++){const t=[];let x=c;for(let k=0;k<n;k++){t.push(x%4+1);x=Math.floor(x/4)}if(t.join()!==orig.join())combos.push(t)}
  return shuffle(combos).slice(0,3).map(t=>{const a=base.slice();pos.forEach((i,k)=>{const b=a[i],low=b.toLowerCase(),m=TONES[low][t[k]-1];a[i]=b===low?m:m.toUpperCase()});return a.join("")});
}

  stage.querySelectorAll("#dirSeg button").forEach(b=>b.onclick=()=>{S.dir=b.dataset.dir;save();quizSetup()});
  stage.querySelectorAll(".blk").forEach(b=>b.onclick=()=>{const lv=+b.dataset.lv,i=+b.dataset.b;startTest(BLOCKS[lv][i],`HSK ${lv} · Bloque ${i+1}`,lv+"-"+(i+1))});
  stage.querySelectorAll("[data-all]").forEach(b=>b.onclick=()=>{const lv=+b.dataset.all;startTest(lv===1?L1:L2,`HSK ${lv} completo`,"all-"+lv)});
  if(nf)$("failTest").onclick=startFailTest;
}
function startFailTest(){startTest(Object.keys(S.fails).map(h=>BY[h]).filter(Boolean),"Mis fallos","fails")}
function quizQuestion(){
  const R=S.run,w=BY[R.words[R.pos]];cur=w;
  if(!DIRS[R.dir])R.dir="ht";const d=R.dir;
  let O,cls="";
  const tv=d==="ht"?toneVariants(w.p):[];
  if(d==="ht"&&tv.length){O=shuffle([{t:w.p,good:true},...tv.map(t=>({t,good:false}))]);cls="pyopt"}
  else{
    const field=d==="mh"||d==="au"?"h":d==="ht"?"p":"m";if(field==="h")cls="hz";else if(field==="p")cls="pyopt";
    const src=w.lv?ALL.filter(x=>x.lv===w.lv):ALL;const opts=[w],seen=new Set([w[field]]);let g=0;
    while(opts.length<4&&g++<300){const o=src[Math.floor(Math.random()*src.length)];if(!seen.has(o[field])){seen.add(o[field]);opts.push(o)}}
    O=shuffle(opts).map(o=>({t:o[field],good:o===w}));
  }
  let q;
  if(d==="mh")q=`<div class="prompt">${esc(w.m)}</div><div class="hint">Elige el carácter</div>`;
  else if(d==="au")q=`<button class="bigspk" data-say="${w.h}" aria-label="Volver a escuchar">${bigIcon}</button><div class="hint">Escucha y elige la palabra. Toca el botón para repetir.</div>${noZhVoice()?`<div class="hint" style="color:var(--seal)">Tu móvil no tiene voz en chino. Instálala en Ajustes → Idioma → Texto a voz.</div>`:""}`;
  else q=`<div class="han ${w.h.length>2?"long":""}">${w.h}</div><div class="hint">${d==="ht"?"Elige el pinyin con los tonos correctos":"¿Qué significa?"}</div>`;
  stage.innerHTML=`<div class="top"><span class="hint" style="text-align:left"><b>${esc(R.label)}</b> · ${DIRS[d][0]} · ${R.pos+1}/${R.words.length}</span><button class="link" id="quit">Salir</button></div>
    <div class="bar" style="margin:8px 0 12px"><i style="width:${R.pos/R.words.length*100}%"></i></div>
    <div class="card" style="min-height:230px"><span class="lvl">${lvTag(w)}</span>${d==="au"?"":spk()}${q}<div id="after" style="display:flex;flex-direction:column;align-items:center;gap:6px"></div></div>
    <div class="row" style="margin-top:12px">${O.map((o,i)=>`<button class="btn opt ${cls}" data-i="${i}">${esc(o.t)}</button>`).join("")}</div>
    <button class="btn yes wide" id="nextBtn" style="margin-top:10px" hidden>Siguiente</button>`;
  if(d==="au")speak(w.h);
  $("quit").onclick=()=>{S.run=null;save();render()};
  stage.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(answered)return;answered=true;
    const good=O[+b.dataset.i].good;grade(w,good);
    if(good){R.ok++;if(R.key==="fails"||S.fails[w.h]){delete S.fails[w.h]}}else R.wrong.push(w.h);
    save();updateBadge();
    stage.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(O[+x.dataset.i].good)x.classList.add("ok")});
    if(!good)b.classList.add("bad");
    $("after").innerHTML=`${d==="au"?`<div class="han ${w.h.length>2?"long":""}" style="font-size:56px">${w.h}</div>`:""}<div class="py">${esc(w.p)}</div>${d==="mh"?"":`<div class="mean">${esc(w.m)}</div>`}`;
    speak(w.h);stats();
    const nb=$("nextBtn");nb.hidden=false;nb.focus();
    nb.onclick=()=>{R.pos++;answered=false;save();render()};
  });
}
function quizResults(){
  const R=S.run,n=R.words.length;
  if(R.key!=="fails"&&(S.best[R.key]==null||R.ok>S.best[R.key]))S.best[R.key]=R.ok;save();
  const wrong=[...new Set(R.wrong)].map(h=>BY[h]);
  stage.innerHTML=`<div class="panel">
    <div class="hint" style="text-align:left"><b>${esc(R.label)}</b> · terminado</div>
    <div class="big">${R.ok}<small> / ${n} aciertos</small></div>
    ${wrong.length?`<h2>Has fallado ${wrong.length}</h2><div class="list">${wrong.map(itemHTML).join("")}</div>
      <button class="btn no wide" id="redoWrong">Repetir estos ${wrong.length} fallos</button>`:`<div class="empty">Sin fallos. ¡Perfecto!</div>`}
    <div class="row"><button class="btn" id="again2">Repetir test</button><button class="btn yes" id="back">Elegir otro</button></div>
  </div>`;
  if(wrong.length)$("redoWrong").onclick=()=>startTest(wrong,R.label+" · fallos",R.key==="fails"?"fails":"redo");
  $("again2").onclick=()=>startTest(R.words.map(h=>BY[h]),R.label,R.key);
  $("back").onclick=()=>{S.run=null;save();render()};
}
function quiz(){if(!S.run)return quizSetup();if(S.run.pos>=S.run.words.length)return quizResults();quizQuestion()}

/* ---------- Fallos ---------- */
const itemHTML=w=>`<div class="item"><span class="h">${w.h}</span><div class="t"><div>${esc(w.p)}</div><div>${esc(w.m)}</div></div><button class="x" data-say="${w.h}" aria-label="Escuchar">${icon}</button></div>`;
function failsView(){
  const list=Object.entries(S.fails).map(([h,c])=>({w:BY[h],c})).filter(x=>x.w).sort((a,b)=>b.c-a.c);
  if(!list.length){stage.innerHTML=`<div class="panel"><div class="empty">Aún no tienes fallos guardados.<br>Cuando falles una palabra en un test o marques "Otra vez" en las tarjetas, aparecerá aquí.</div></div>`;return}
  stage.innerHTML=`<div class="panel">
    <div class="row"><button class="btn no" id="ft">Test de fallos</button><button class="btn" id="fc">Repasar con tarjetas</button></div>
    <div class="hint" style="text-align:left">Cuando aciertes una palabra en un test, sale de la lista.</div>
    <div class="list">${list.map(({w,c})=>`<div class="item"><span class="h">${w.h}</span><div class="t"><div>${esc(w.p)} <span class="cnt">×${c}</span></div><div>${esc(w.m)}</div></div><div style="display:flex"><button class="x" data-say="${w.h}" aria-label="Escuchar">${icon}</button><button class="x" data-rm="${w.h}" aria-label="Quitar de la lista">Quitar</button></div></div>`).join("")}</div>
  </div>`;
  $("ft").onclick=()=>{S.mode="quiz";startFailTest()};
  $("fc").onclick=()=>{S.mode="cards";S.cardFails=true;save();cur=null;render()};
  stage.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{delete S.fails[b.dataset.rm];save();updateBadge();failsView()});
}

/* ---------- Lecturas ---------- */
function readList(){
  const list=STORIES.filter(s=>!S.level||s.lv===S.level);
  stage.innerHTML=`<div class="stories">${list.map(s=>`<button class="story" data-id="${s.id}"><span class="tag">HSK ${s.lv}</span><b class="zh">${s.t}</b><span>${esc(s.es)}</span><span class="meta">${s.s.length} frases${S.read[s.id]?" · <em>Leída</em>":""}</span></button>`).join("")}</div>`;
  stage.querySelectorAll(".story").forEach(b=>b.onclick=()=>{S.story=b.dataset.id;save();render();window.scrollTo(0,0)});
}
function reader(){
  const st=STORIES.find(x=>x.id===S.story);if(!st){S.story=null;return readList()}
  const sent=st.s.map(([zh,es])=>{const T=zh.split(" ").map(tok);
    const line=T.map(x=>x.pu?`<span>${x.pu}</span>`:`<ruby class="w${S.fails[x.h]?" saved":""}" data-h="${x.h}" data-p="${esc(x.p)}" data-m="${esc(x.m)}">${x.h}<rt>${esc(x.p)}</rt></ruby>`).join("");
    const say=T.map(x=>x.pu||x.h).join("");
    return `<div class="sent"><div class="zhline">${line}</div><button class="x" data-say="${say}" aria-label="Escuchar la frase">${icon}</button><div class="tr">${esc(es)}</div></div>`}).join("");
  stage.innerHTML=`<div style="display:flex;flex-direction:column;gap:12px">
    <div class="top"><button class="link" id="back2">← Lecturas</button><span class="tag">HSK ${st.lv}</span></div>
    <div><div class="han" style="font-size:30px;text-align:left;font-weight:700">${st.t}</div><div class="hint" style="text-align:left">${esc(st.es)}</div></div>
    <div class="chips"><button class="chip" id="tPy" aria-pressed="${S.py}">Pinyin</button><button class="chip" id="tTr" aria-pressed="${S.tr}">Traducción</button></div>
    <div class="hint" style="text-align:left">Toca o mantén pulsada una palabra para ver qué significa y guardarla.</div>
    <div class="text ${S.py?"":"nopy"} ${S.tr?"":"notr"}" id="txt">${sent}</div>
    <button class="btn ${S.read[st.id]?"":"yes"} wide" id="done">${S.read[st.id]?"Leída ✓":"Marcar como leída"}</button></div>`;
  $("back2").onclick=()=>{S.story=null;save();render()};
  $("tPy").onclick=()=>{S.py=!S.py;save();$("tPy").setAttribute("aria-pressed",S.py);$("txt").classList.toggle("nopy",!S.py)};
  $("tTr").onclick=()=>{S.tr=!S.tr;save();$("tTr").setAttribute("aria-pressed",S.tr);$("txt").classList.toggle("notr",!S.tr)};
  $("done").onclick=()=>{S.read[st.id]=!S.read[st.id];save();reader()};
  const open=e=>{const w=e.target.closest("ruby.w");if(!w)return;e.preventDefault();openSheet(w)};
  $("txt").addEventListener("click",open);$("txt").addEventListener("contextmenu",open);
}
let shEl=null;
function openSheet(el){
  document.querySelectorAll("ruby.w.sel").forEach(x=>x.classList.remove("sel"));el.classList.add("sel");shEl=el;
  const h=el.dataset.h,d=BY[h];
  $("shTag").textContent=d&&d.lv?`HSK ${d.lv}`:"Fuera de HSK 1-2";
  $("shHan").textContent=h;$("shPy").textContent=el.dataset.p;$("shMean").textContent=el.dataset.m;
  syncSave();$("sheet").hidden=false;$("sheetBg").hidden=false;speak(h);
}
function syncSave(){const h=shEl.dataset.h,b=$("shSave");const on=!!S.fails[h];b.textContent=on?"Guardada ✓ (quitar)":"Guardar para estudiar";b.className="btn "+(on?"":"yes")}
function closeSheet(){$("sheet").hidden=true;$("sheetBg").hidden=true;if(shEl)shEl.classList.remove("sel")}
$("sheetBg").onclick=closeSheet;$("sheetClose").onclick=closeSheet;
$("shSay").onclick=()=>speak(shEl.dataset.h);
$("shSave").onclick=()=>{const h=shEl.dataset.h;if(S.fails[h])delete S.fails[h];else S.fails[h]=1;save();updateBadge();syncSave();
  document.querySelectorAll(`ruby.w[data-h="${h}"]`).forEach(x=>x.classList.toggle("saved",!!S.fails[h]))};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

/* ---------- General ---------- */
function updateBadge(){const n=Object.keys(S.fails).length;const b=$("failBadge");b.hidden=!n;b.textContent=n}
function stats(){
  const p=pool(),k=p.filter(w=>boxOf(w)>=3).length;
  $("known").textContent=k;$("total").textContent=p.length;$("barfill").style.width=(p.length?k/p.length*100:0)+"%";
  $("stats").innerHTML=S.mode==="fails"||S.mode==="read"?"":`<span>Aciertos <b>${sess.ok}</b></span><span>Fallos <b>${sess.bad}</b></span><span>Racha <b>${sess.streak}</b></span>`;
}
function render(){
  document.querySelectorAll("#modeSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===S.mode));
  document.querySelectorAll("#levelSeg button").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.lv===S.level));
  $("levelSeg").hidden=S.mode==="fails"||(S.mode==="quiz"&&!!S.run)||(S.mode==="cards"&&S.cardFails)||(S.mode==="read"&&!!S.story);
  updateBadge();
  if(S.mode==="cards")cards();else if(S.mode==="quiz")quiz();else if(S.mode==="read")(S.story?reader():readList());else failsView();
  stats();
}
document.querySelectorAll("#modeSeg button").forEach(b=>b.onclick=()=>{if(S.mode===b.dataset.mode&&S.mode==="read")S.story=null;if(b.dataset.mode==="cards"&&S.mode!=="cards"){S.cardFails=false;cur=null}S.mode=b.dataset.mode;save();render();window.scrollTo(0,0)});
document.querySelectorAll("#levelSeg button").forEach(b=>b.onclick=()=>{S.level=+b.dataset.lv;save();cur=null;render()});
$("reset").onclick=()=>{$("confirmWrap").hidden=false};
$("resetYes").onclick=()=>{S.box={};S.fails={};S.best={};S.run=null;S.read={};S.cardFails=false;sess={ok:0,bad:0,streak:0};save();$("confirmWrap").hidden=true;cur=null;render()};
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
